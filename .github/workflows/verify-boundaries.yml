name: Verify architecture boundaries

# Test changed addons and their affected consumers. Omnifreight is excluded.
# PRs run on every target branch; direct push checks run on main and dev.
on:
  push:
    branches: [main, dev]
  pull_request:

# Stop an older run when a newer commit arrives on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.scope.outputs.modules }}
      community: ${{ steps.scope.outputs.community }}
      enterprise: ${{ steps.scope.outputs.enterprise }}
      base: ${{ steps.base.outputs.sha }}
      upgrade_community: ${{ steps.scope.outputs.upgrade_community }}
      upgrade_enterprise: ${{ steps.scope.outputs.upgrade_enterprise }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve comparison commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BEFORE"
          else
            base=$(git hash-object -w -t tree /dev/null)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Test addon selection
        run: python3 -m unittest discover -s tools/tests -v
      - name: Select changed addons and affected consumers
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 tools/ci_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  quality:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-quality.txt
      - run: python -m pip install -r tools/requirements-quality.txt
      - name: Block new naming and lint findings (Omnifreight excluded)
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base }}
        run: python tools/check_quality.py --base "$BASE_SHA"

  # Static AST scan, no Odoo/Postgres needed -- fast feedback on the exact
  # bug shape that broke order.bridge.mixin and operations.budget.line this
  # cycle (two modules defining the same method on the same model with
  # neither calling super()) before the much slower Odoo jobs below even
  # start. Always runs: it scans the whole repo and is cheap regardless of
  # which client changed.
  check-extension-collisions:
    runs-on: ubuntu-latest
    name: check extension collisions

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for cross-module method collisions
        run: python3 tools/check_extension_collisions.py

  # Static AST diff, no Odoo/Postgres needed -- fast feedback on the exact
  # gap that let ele_win_rate ship as a field-type change with no migration:
  # a diff that changes a field's fields.<Type> with no matching file under
  # that module's migrations/ directory. See tools/check_migration_coverage.py
  # and docs/MIGRATIONS.md for what this does and does not catch.
  check-migration-coverage:
    runs-on: ubuntu-latest
    name: check migration coverage
    needs: detect-changes

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for field type changes missing a migration script
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base }}
        run: python3 tools/check_migration_coverage.py --base "$BASE_SHA"

  verify:
    needs: detect-changes
    runs-on: ubuntu-latest
    name: verify (community)
    if: needs.detect-changes.outputs.community == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          # Password for an ephemeral, job-scoped Postgres container -- reachable
          # only on localhost within this single run and destroyed immediately
          # after. Not a real secret, but kept out of source (as a repo Actions
          # secret) rather than hardcoded, to avoid every secret-scanner flagging
          # a `PASSWORD: <literal>` line as if it were one.
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tools/verify_boundaries.sh and Odoo both resolve their Postgres
      # connection through these standard libpq environment variables -- no
      # script changes needed to run against the service container instead of
      # a local trust/peer-auth install.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: odoo
      PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      ODOO_PATH: ${{ github.workspace }}/odoo-core
      VERIFY_MODULES: ${{ needs.detect-changes.outputs.modules }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Odoo 19 core
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '19.0'
          path: odoo-core
          # Odoo core is a large repository; the addons/ and odoo/ trees plus
          # requirements.txt are all this job needs, so a shallow clone is
          # enough and keeps the checkout fast.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: odoo-core/requirements.txt

      - name: Install Odoo's system dependencies
        # psycopg2, python-ldap, lxml and Pillow are all pinned to source (not
        # manylinux-wheel-only) versions in Odoo's requirements.txt for at
        # least one supported Python version, so the headers below are needed
        # to build them. This list matches Odoo's own documented Debian/Ubuntu
        # dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libssl-dev \
            libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libpq-dev \
            postgresql-client

      - name: Install Odoo's Python dependencies
        run: python -m pip install --upgrade pip && pip install -r odoo-core/requirements.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && exit 0
            sleep 2
          done
          echo "Postgres never became ready" >&2
          exit 1

      - name: Verify architecture boundaries
        env:
          # No venv in this job -- Odoo's dependencies are installed directly
          # into the runner's Python, so ODOO_PYTHON overrides the script's
          # default of "$ODOO_PATH/venv/bin/python".
          ODOO_PYTHON: python
        run: bash tools/verify_boundaries.sh

      - name: Upgrade affected addons from the previous revision
        if: needs.detect-changes.outputs.upgrade_community != ''
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base }}
          UPGRADE_MODULES: ${{ needs.detect-changes.outputs.upgrade_community }}
          ODOO_PYTHON: python
        run: python tools/verify_upgrades.py --base "$BASE_SHA" --modules "$UPGRADE_MODULES"


  # Only addons requiring Enterprise run here. Community tests are not repeated.
  verify-enterprise:
    needs: detect-changes
    runs-on: ubuntu-latest
    name: verify (enterprise)
    # Private source cannot be fetched by fork pull requests.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.detect-changes.outputs.enterprise == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: odoo
      PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      ODOO_PATH: ${{ github.workspace }}/odoo-core
      ODOO_ENTERPRISE_PATH: ${{ github.workspace }}/odoo-enterprise
      VERIFY_MODULES: ${{ needs.detect-changes.outputs.modules }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Odoo 19 core
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '19.0'
          path: odoo-core
          fetch-depth: 1

      - name: Check for Enterprise checkout credentials
        id: enterprise_auth
        env:
          ENTERPRISE_TOKEN: ${{ secrets.ODOO_ENTERPRISE_TOKEN }}
        run: |
          if [ -n "$ENTERPRISE_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error::Affected addons require Enterprise. Set ODOO_ENTERPRISE_TOKEN to run their checks."
            exit 1
          fi

      - name: Check out Odoo 19 Enterprise
        if: steps.enterprise_auth.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: odoo/enterprise
          ref: '19.0'
          path: odoo-enterprise
          fetch-depth: 1
          token: ${{ secrets.ODOO_ENTERPRISE_TOKEN }}

      - name: Set up Python
        if: steps.enterprise_auth.outputs.has_token == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: odoo-core/requirements.txt

      - name: Install Odoo's system dependencies
        if: steps.enterprise_auth.outputs.has_token == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libssl-dev \
            libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libpq-dev \
            postgresql-client

      - name: Install Odoo's Python dependencies
        if: steps.enterprise_auth.outputs.has_token == 'true'
        run: python -m pip install --upgrade pip && pip install -r odoo-core/requirements.txt

      - name: Wait for Postgres
        if: steps.enterprise_auth.outputs.has_token == 'true'
        run: |
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && exit 0
            sleep 2
          done
          echo "Postgres never became ready" >&2
          exit 1

      - name: Verify architecture boundaries (with Enterprise on the addons path)
        if: steps.enterprise_auth.outputs.has_token == 'true'
        env:
          ODOO_PYTHON: python
        run: bash tools/verify_boundaries.sh

      - name: Upgrade affected Enterprise addons
        if: steps.enterprise_auth.outputs.has_token == 'true' && needs.detect-changes.outputs.upgrade_enterprise != ''
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base }}
          UPGRADE_MODULES: ${{ needs.detect-changes.outputs.upgrade_enterprise }}
          ODOO_PYTHON: python
        run: python tools/verify_upgrades.py --base "$BASE_SHA" --modules "$UPGRADE_MODULES"
