name: Verify architecture boundaries

# Runs tools/verify_boundaries.sh against a real Odoo 19 instance on every push
# to main and every pull request. This is the enforcement half of the layout:
# the README and docs/ARCHITECTURE_ROADMAP.md make claims about what installs
# where (shared/ modules pull in no vertical, omni_ops installs with no
# budgeting, both verticals coexist) -- claims that were previously checked by
# hand and, as a result, silently stopped being true more than once. This job
# is what keeps them true.
#
# push is scoped to main, not every branch: a feature branch with an open PR
# already gets a run from pull_request's synchronize event on every push to
# it, so also matching it here ran everything twice, back to back, for no
# extra coverage.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Determines which client verticals actually changed, so the Odoo jobs
  # below only exercise scenarios relevant to this diff instead of every
  # scenario on every push -- this is a real cost once more than two clients
  # share the repo. shared/ has no client-scoped filter: its whole claim is
  # "safe for every consumer", so any change there (or to the verification
  # tooling itself) always runs everything, on push:main as well as PRs.
  detect-changes:
    runs-on: ubuntu-latest
    name: detect changed areas
    outputs:
      shared_changed: ${{ steps.filter.outputs.shared }}
      trading_changed: ${{ steps.filter.outputs.trading }}
      omnifreight_changed: ${{ steps.filter.outputs.omnifreight }}
      any_client_changed: ${{ steps.filter.outputs.trading == 'true' || steps.filter.outputs.omnifreight == 'true' }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Detect changed areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'tools/verify_boundaries.sh'
              - 'tools/check_extension_collisions.py'
              - '.github/workflows/verify-boundaries.yml'
            trading:
              - 'product/commodity_trading/**'
            omnifreight:
              - 'custom/omnifreight/**'
            # Add one block per new client vertical as it's added, and a
            # matching VERIFY_<CLIENT> gate in tools/verify_boundaries.sh.

  # Static AST scan, no Odoo/Postgres needed -- fast feedback on the exact
  # bug shape that broke order.bridge.mixin and operations.budget.line this
  # cycle (two modules defining the same method on the same model with
  # neither calling super()) before the much slower Odoo jobs below even
  # start. Always runs: it scans the whole repo and is cheap regardless of
  # which client changed.
  check-extension-collisions:
    runs-on: ubuntu-latest
    name: check extension collisions

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for cross-module method collisions
        run: python3 tools/check_extension_collisions.py

  # Static AST diff, no Odoo/Postgres needed -- fast feedback on the exact
  # gap that let ele_win_rate ship as a field-type change with no migration:
  # a diff that changes a field's fields.<Type> with no matching file under
  # that module's migrations/ directory. See tools/check_migration_coverage.py
  # and docs/MIGRATIONS.md for what this does and does not catch.
  check-migration-coverage:
    runs-on: ubuntu-latest
    name: check migration coverage
    # On a direct push to main (as opposed to a pull_request event),
    # github.base_ref is unset and the fallback below resolves to 'main',
    # which on that run is the same commit as HEAD -- the diff is empty and
    # this check trivially passes. That's an accepted no-op for push:main,
    # not a hole: the real check runs on the PR's pull_request event, same
    # assumption the check-extension-collisions job above already makes.

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for field type changes missing a migration script
        run: python3 tools/check_migration_coverage.py --base origin/${{ github.base_ref || 'main' }}

  verify:
    needs: detect-changes
    runs-on: ubuntu-latest
    name: verify (community)
    # Skip only when neither shared/ nor any client vertical changed (e.g. a
    # docs-only PR) -- push:main always has shared_changed or a client flag
    # true whenever code changed, since the filter also runs there.
    if: needs.detect-changes.outputs.shared_changed == 'true' || needs.detect-changes.outputs.any_client_changed == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          # Password for an ephemeral, job-scoped Postgres container -- reachable
          # only on localhost within this single run and destroyed immediately
          # after. Not a real secret, but kept out of source (as a repo Actions
          # secret) rather than hardcoded, to avoid every secret-scanner flagging
          # a `PASSWORD: <literal>` line as if it were one.
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tools/verify_boundaries.sh and Odoo both resolve their Postgres
      # connection through these standard libpq environment variables -- no
      # script changes needed to run against the service container instead of
      # a local trust/peer-auth install.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: odoo
      PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      ODOO_PATH: ${{ github.workspace }}/odoo-core
      # Read by tools/verify_boundaries.sh: 'all' (shared/ or the tooling
      # itself changed) runs every scenario; otherwise only the scenario
      # groups for verticals that actually changed run.
      VERIFY_SCOPE: ${{ needs.detect-changes.outputs.shared_changed == 'true' && 'all' || 'scoped' }}
      VERIFY_TRADING: ${{ needs.detect-changes.outputs.trading_changed }}
      VERIFY_OMNIFREIGHT: ${{ needs.detect-changes.outputs.omnifreight_changed }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out Odoo 19 core
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '19.0'
          path: odoo-core
          # Odoo core is a large repository; the addons/ and odoo/ trees plus
          # requirements.txt are all this job needs, so a shallow clone is
          # enough and keeps the checkout fast.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Odoo's system dependencies
        # psycopg2, python-ldap, lxml and Pillow are all pinned to source (not
        # manylinux-wheel-only) versions in Odoo's requirements.txt for at
        # least one supported Python version, so the headers below are needed
        # to build them. This list matches Odoo's own documented Debian/Ubuntu
        # dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libssl-dev \
            libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libpq-dev \
            postgresql-client

      - name: Install Odoo's Python dependencies
        run: python -m pip install --upgrade pip && pip install -r odoo-core/requirements.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && exit 0
            sleep 2
          done
          echo "Postgres never became ready" >&2
          exit 1

      - name: Verify architecture boundaries
        env:
          # No venv in this job -- Odoo's dependencies are installed directly
          # into the runner's Python, so ODOO_PYTHON overrides the script's
          # default of "$ODOO_PATH/venv/bin/python".
          ODOO_PYTHON: python
        run: bash tools/verify_boundaries.sh

  # Mirrors the community job but also puts Odoo Enterprise on the addons
  # path, because Enterprise ships its own inherited views over sale/purchase/
  # stock/account -- the same models these modules extend -- and a clash there
  # would not show up against Community alone. odoo/enterprise is a private
  # repo, so this needs a checkout credential with read access to it (a
  # deploy key or a fine-grained PAT) stored as the ODOO_ENTERPRISE_TOKEN repo
  # secret. Trading/trading_budget don't declare an Enterprise dependency
  # today -- this job is the proof that stays true, not a requirement it adds.
  verify-enterprise:
    needs: detect-changes
    runs-on: ubuntu-latest
    name: verify (enterprise)
    # A fork's pull_request run has no access to this repo's secrets, so the
    # token would be empty; skip rather than fail on an access error that has
    # nothing to do with the code being tested. Also skip when neither
    # shared/ nor any client vertical changed, same as the community job.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs.detect-changes.outputs.shared_changed == 'true' || needs.detect-changes.outputs.any_client_changed == 'true')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: odoo
      PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      ODOO_PATH: ${{ github.workspace }}/odoo-core
      ODOO_ENTERPRISE_PATH: ${{ github.workspace }}/odoo-enterprise
      VERIFY_SCOPE: ${{ needs.detect-changes.outputs.shared_changed == 'true' && 'all' || 'scoped' }}
      VERIFY_TRADING: ${{ needs.detect-changes.outputs.trading_changed }}
      VERIFY_OMNIFREIGHT: ${{ needs.detect-changes.outputs.omnifreight_changed }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out Odoo 19 core
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '19.0'
          path: odoo-core
          fetch-depth: 1

      - name: Check for Enterprise checkout credentials
        id: enterprise_auth
        run: |
          if [ -n "${{ secrets.ODOO_ENTERPRISE_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ODOO_ENTERPRISE_TOKEN secret is not set -- skipping the Enterprise verification job. Add a token with read access to odoo/enterprise to enable it."
          fi

      - name: Check out Odoo 19 Enterprise
        if: steps.enterprise_auth.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: odoo/enterprise
          ref: '19.0'
          path: odoo-enterprise
          fetch-depth: 1
          token: ${{ secrets.ODOO_ENTERPRISE_TOKEN }}

      - name: Set up Python
        if: steps.enterprise_auth.outputs.has_token == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Odoo's system dependencies
        if: steps.enterprise_auth.outputs.has_token == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libldap2-dev libsasl2-dev libssl-dev \
            libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libpq-dev \
            postgresql-client

      - name: Install Odoo's Python dependencies
        if: steps.enterprise_auth.outputs.has_token == 'true'
        run: python -m pip install --upgrade pip && pip install -r odoo-core/requirements.txt

      - name: Wait for Postgres
        if: steps.enterprise_auth.outputs.has_token == 'true'
        run: |
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && exit 0
            sleep 2
          done
          echo "Postgres never became ready" >&2
          exit 1

      - name: Verify architecture boundaries (with Enterprise on the addons path)
        if: steps.enterprise_auth.outputs.has_token == 'true'
        env:
          ODOO_PYTHON: python
        run: bash tools/verify_boundaries.sh
